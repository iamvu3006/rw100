<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Quản lý account</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>

    <body>
        <div class="container mt-4">
            <div class="row mb-3">
                <div class="col-md-12 text-end">
                    <button
                        class="btn btn-light"
                        onclick="changeTheme('light')"
                    >
                        Light
                    </button>
                    <button class="btn btn-dark" onclick="changeTheme('dark')">
                        Dark
                    </button>
                </div>
            </div>

            <h2>Quản lý account</h2>

            <hr />

            <div class="row">
                <div class="col-md-12 text-end mb-3">
                    <button
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#modal-id"
                    >
                        Create New Account
                    </button>
                </div>
            </div>

            <div
                class="modal fade"
                id="modal-id"
                tabindex="-1"
                aria-hidden="true"
            >
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Thêm mới Account</h5>
                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Close"
                            ></button>
                        </div>

                        <div class="modal-body">
                            <form>
                                <div class="mb-3">
                                    <label class="form-label fw-bold"
                                        >Avatar:</label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="avatar"
                                        placeholder="Avatar URL"
                                    />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold"
                                        >Username:</label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="username"
                                    />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold"
                                        >Fullname:</label
                                    >
                                    <input
                                        type="text"
                                        class="form-control"
                                        id="fullName"
                                    />
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold"
                                        >Age:</label
                                    >
                                    <input
                                        type="number"
                                        class="form-control"
                                        id="age"
                                    />
                                </div>
                            </form>
                        </div>

                        <div class="modal-footer">
                            <button
                                type="button"
                                class="btn btn-primary"
                                id="submit"
                            >
                                Save
                            </button>
                            <button
                                type="button"
                                class="btn btn-default"
                                data-bs-dismiss="modal"
                            >
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Avatar</th>
                        <th>Username</th>
                        <th>FullName</th>
                        <th>Age</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tblAccount"></tbody>
            </table>
        </div>

        <script src="demo_ajax.js"></script>
    </body>
</html>
