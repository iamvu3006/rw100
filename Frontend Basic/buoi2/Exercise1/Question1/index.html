<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1 - Question 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }
        .container {
            width: 600px;
            background-color: #ffffff;
            border: 1px solid #cccccc;
            /* Sử dụng margin: auto để căn giữa container */
            margin: 0 auto; 
            padding: 20px;
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: #007bff;
            color: #ffffff;
            display: table;
            text-align: center;
        }
        .box span {
            display: table-cell;
            vertical-align: middle;
            font-weight: bold;
        }
        /* Demo các kiểu margin */
        .margin-top {
            margin-top: 30px;
            background-color: #28a745;
        }
        .margin-left {
            margin-left: 50px;
            background-color: #dc3545;
        }
        .margin-bottom {
            margin-bottom: 40px;
            background-color: #ffc107;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Demo Thuộc Tính Margin</h2>
        
        <div class="box">
            <span>Gốc</span>
        </div>
        
        <div class="box margin-top">
            <span>Margin Top</span>
        </div>
        
        <div class="box margin-left">
            <span>Margin Left</span>
        </div>
        
        <div class="box margin-bottom">
            <span>Margin Bottom</span>
        </div>
        
        <div class="box">
            <span>Kế Tiếp</span>
        </div>
    </div>

</body>
</html>
