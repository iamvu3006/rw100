<!DOCTYPE html>
<html>
<head>
    <title>Exercise 3 - Question 2</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        .container{
            width:900px;
            margin:20px auto;
        }

        header{
            height:110px;
            background:red;
        }

        nav{
            height:40px;
            background:green;
        }

        .content{
            display:flex;
        }

        .left{
            width:70%;
        }

        section{
            height:200px;
            background:blue;
        }

        article{
            height:200px;
            background:black;
        }

        aside{
            width:30%;
            height:400px;
            background:gray;
        }

        footer{
            height:110px;
            background:orange;
        }

        h2{
            color:white;
            padding:10px;
        }

    </style>
</head>

<body>

<div class="container">

    <header>
        <h2>Header</h2>
    </header>

    <nav>
        <h2>Nav</h2>
    </nav>

    <div class="content">

        <div class="left">
            <section>
                <h2>Section</h2>
            </section>

            <article>
                <h2>Article</h2>
            </article>
        </div>

        <aside>
            <h2>Aside</h2>
        </aside>

    </div>

    <footer>
        <h2>Footer</h2>
    </footer>

</div>

</body>
</html>
