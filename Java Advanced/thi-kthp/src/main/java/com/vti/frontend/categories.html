<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danh mục món ăn · RW100</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <div class="page-head">
      <div><h1>Danh mục món ăn</h1><p>Nhóm các món ăn theo danh mục để dễ tìm kiếm và lọc.</p></div>
      <button class="btn btn-primary" id="btnAdd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Thêm danh mục</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tên danh mục</th><th>Mô tả</th><th style="text-align:right">Hành động</th></tr></thead>
        <tbody id="catBody"></tbody>
      </table>
      <div id="emptyState"></div>
    </div>
  </div>

  <div class="modal-overlay" id="catModal">
    <div class="modal">
      <div class="modal-header"><h2 id="modalTitle">Thêm danh mục</h2><button class="modal-close" onclick="closeModal('catModal')">✕</button></div>
      <form id="catForm">
        <div class="modal-body">
          <input type="hidden" id="catId">
          <div class="form-row"><label>Tên danh mục</label><input class="field" id="name" placeholder="vd: Món chính"></div>
          <div class="form-row"><label>Mô tả</label><textarea class="field" id="description" rows="3" placeholder="Mô tả ngắn gọn..."></textarea></div>
          <div class="error-text" id="formError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('catModal')">Hủy</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/categories.js"></script>
</body>
</html>
