<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài khoản · RW100</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <div class="page-head">
      <div><h1>Tài khoản nhân viên</h1><p>Quản lý quyền truy cập hệ thống (chỉ Quản trị viên).</p></div>
      <button class="btn btn-primary" id="btnAdd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Thêm tài khoản</button>
    </div>

    <div class="filter-bar">
      <input class="field" id="searchInput" placeholder="Tìm theo tên, username, email..." style="min-width:260px">
      <select class="field" id="roleFilter">
        <option value="">Tất cả vai trò</option>
        <option value="ADMIN">Quản trị viên</option>
        <option value="STAFF">Nhân viên</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th></th><th>Họ tên</th><th>Tên đăng nhập</th><th>Email</th><th>Vai trò</th><th>Ngày tạo</th><th style="text-align:right">Hành động</th></tr></thead>
        <tbody id="accBody"></tbody>
      </table>
      <div id="emptyState"></div>
      <div class="pagination" id="pagination" style="display:none"></div>
    </div>
  </div>

  <div class="modal-overlay" id="accModal">
    <div class="modal">
      <div class="modal-header"><h2 id="modalTitle">Thêm tài khoản</h2><button class="modal-close" onclick="closeModal('accModal')">✕</button></div>
      <form id="accForm">
        <div class="modal-body">
          <input type="hidden" id="accId">
          <div class="form-row" id="usernameRow"><label>Tên đăng nhập</label><input class="field" id="username" placeholder="vd: staff03"></div>
          <div class="form-row" id="passwordRow"><label>Mật khẩu</label><input class="field" id="password" type="password" placeholder="••••••••"></div>
          <div class="form-row"><label>Họ và tên</label><input class="field" id="fullName" placeholder="Nguyễn Văn A"></div>
          <div class="form-row"><label>Email</label><input class="field" id="email" type="email" placeholder="ban@restaurant.com"></div>
          <div class="form-grid">
            <div class="form-row"><label>Vai trò</label>
              <select class="field" id="role"><option value="STAFF">Nhân viên</option><option value="ADMIN">Quản trị viên</option></select>
            </div>
            <div class="form-row"><label>Ảnh đại diện (URL)</label><input class="field" id="avatarUrl" placeholder="https://..."></div>
          </div>
          <div class="error-text" id="formError"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" onclick="closeModal('accModal')">Hủy</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/accounts.js"></script>
</body>
</html>
