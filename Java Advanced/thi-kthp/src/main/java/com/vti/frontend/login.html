<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập · RW100</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-left">
      <div class="auth-mark">RW100</div>
      <div class="auth-tag">Restaurant Order Desk</div>
      <p class="auth-quote">Quản lý bàn, thực đơn và đơn hàng theo thời gian thực — mọi phiếu order được ghi nhận rõ ràng như một tờ order thật từ bếp.</p>
    </div>
    <div class="auth-right">
      <form class="auth-form" id="loginForm" novalidate>
        <h1>Đăng nhập</h1>
        <p>Nhập tài khoản nhân viên để tiếp tục.</p>
        <div class="banner banner-error" id="errorBanner"></div>
        <div class="form-row">
          <label for="username">Tên đăng nhập</label>
          <input class="field" id="username" name="username" autocomplete="username" placeholder="vd: staff01">
        </div>
        <div class="form-row">
          <label for="password">Mật khẩu</label>
          <input class="field" id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" type="submit" id="submitBtn">Đăng nhập</button>
        <div class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></div>
      </form>
    </div>
  </div>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
